# =====================================================================
# Correction — Exercice 4 : Service, ConfigMap et Secret
# Thème : exposition réseau, externalisation config & données sensibles
# =====================================================================
#
# Application :  kubectl apply -f Correction_Exercice4_Service_ConfigMap_Secret.yaml
#
# ---------------------------------------------------------------------
# 1) Service — expose les Pods labellisés "app: mon-appli"
# ---------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: mon-appli-service
spec:
  selector:
    app: mon-appli          # cible tous les Pods portant ce label
                             # (donc les Pods créés par mon-appli-deployment)
  ports:
    - port: 80               # port exposé par le Service
      targetPort: 8080        # port réellement écouté par le conteneur
  type: ClusterIP            # voir justification ci-dessous
---
# ---------------------------------------------------------------------
# 2) ConfigMap — configuration NON sensible
# ---------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mon-appli-config
data:
  DATABASE_URL: "jdbc:postgresql://db-service:5432/ecole"
---
# ---------------------------------------------------------------------
# 3) Secret — donnée SENSIBLE
# ---------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mon-appli-secret
type: Opaque
stringData:
  # "stringData" permet d'écrire la valeur en clair dans le manifeste ;
  # Kubernetes se charge de l'encoder en base64 en interne (le champ
  # "data" équivalent attendrait, lui, une valeur déjà encodée en base64).
  DATABASE_PASSWORD: "changez_ce_mot_de_passe"

# =====================================================================
# Justification du type de Service choisi :
#
# ClusterIP est le type par défaut et le plus adapté ici, car l'énoncé
# précise que l'application doit être accessible uniquement par
# d'autres services À L'INTÉRIEUR du cluster. ClusterIP attribue une
# adresse IP interne stable, résolue via le DNS interne du cluster
# (mon-appli-service.default.svc.cluster.local), mais n'expose rien
# vers l'extérieur du cluster. NodePort ou LoadBalancer seraient
# nécessaires uniquement si l'application devait être atteinte depuis
# l'extérieur du cluster (un utilisateur final, un autre système).
# =====================================================================

# =====================================================================
# Modification du Deployment de l'exercice 3 pour injecter ConfigMap et
# Secret comme variables d'environnement dans le conteneur :
#
# spec:
#   template:
#     spec:
#       containers:
#         - name: mon-appli
#           image: mon-appli:1.0
#           ports:
#             - containerPort: 8080
#           env:
#             - name: DATABASE_URL
#               valueFrom:
#                 configMapKeyRef:
#                   name: mon-appli-config
#                   key: DATABASE_URL
#             - name: DATABASE_PASSWORD
#               valueFrom:
#                 secretKeyRef:
#                   name: mon-appli-secret
#                   key: DATABASE_PASSWORD
#
# Ainsi, l'image "mon-appli:1.0" reste générique et ne contient aucune
# configuration ni aucun mot de passe codé en dur : ces valeurs sont
# injectées dynamiquement par Kubernetes au démarrage du Pod, et
# peuvent être changées (nouvelle URL, rotation du mot de passe) sans
# reconstruire l'image du conteneur.
# =====================================================================
